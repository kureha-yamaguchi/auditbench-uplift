# `harbor run -c configs/harbor/baseline_job.yaml` : standalone baseline / dev evaluation job.
# Set AUDITBENCH_API_BASE to the vLLM endpoint serving Qwen/Qwen3-8B at the pinned revision.
job_name: baseline-train-dev
jobs_dir: jobs
n_attempts: 5
n_concurrent_trials: 16
retry:
  max_retries: 2                      # transient infrastructure only; wrong answers are never retried
  include_exceptions: ["EnvironmentStartError", "AddTestsDirError", "DownloadVerifierDirError", "TimeoutError"]
environment:
  type: modal                         # plain YAML: harbor run -c does not resolve OmegaConf env placeholders
  override_cpus: 1
  override_memory_mb: 1024
  override_storage_mb: 1024
  suppress_override_warnings: true
verifier:
  override_timeout_sec: 300
agents:
  - name: terminus-2
    model_name: hosted_vllm/Qwen3-8B
    override_timeout_sec: 1200
    kwargs:
      api_base: http://127.0.0.1:8000/v1   # vLLM on the node (scripts/phase.sh vllm_up)
      max_turns: 32
      suppress_max_turns_warning: true
      enable_summarize: false
      store_all_messages: true
      collect_rollout_details: true
      temperature: 1.0
      model_info: {max_input_tokens: 32768, max_output_tokens: 8192, input_cost_per_token: 0.0, output_cost_per_token: 0.0}
      llm_kwargs: {timeout: 900, max_retries: 0, top_p: 1.0, top_k: -1, min_p: 0.0, max_tokens: 8192}
datasets:
  - path: tasks/train
  - path: tasks/dev
artifacts:
  - /app/findings.json
