# @package harbor_trial_config
# Harbor TrialConfig template for harbor-train / SkyRL (overrides examples/harbor/harbor_trial_config/default.yaml).
# SkyRL injects task.path, agent.model_name, agent.kwargs.api_base and session_id per trial.
trials_dir: ~/runs/${oc.env:RUN_NAME}/trials
timeout_multiplier: 1.0
agent:
  name: terminus-2
  override_timeout_sec: 1200
  kwargs:
    max_turns: 32
    suppress_max_turns_warning: true
    enable_summarize: false
    store_all_messages: true
    collect_rollout_details: true
    temperature: 1.0
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
    llm_kwargs:
      timeout: 900
      max_retries: 0
      top_p: 1.0
      top_k: -1
      min_p: 0.0
      max_tokens: 8192
environment:
  type: ${oc.env:AUDITBENCH_SANDBOX,docker}   # docker = sandboxes on the GPU node; modal once MODAL_TOKEN_* exist
  override_cpus: 1
  override_memory_mb: 1024
  override_storage_mb: 1024
  suppress_override_warnings: true
  kwargs: {}
  # modal only: kwargs: {sandbox_timeout_secs: 1800}
verifier:
  disable: false
  override_timeout_sec: 300
artifacts:
  - /app/findings.json
