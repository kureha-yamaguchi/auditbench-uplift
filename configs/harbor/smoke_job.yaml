# `harbor run -c configs/harbor/smoke_job.yaml` : the Qwen smoke (PLAN.md §6.1) — a handful of train and dev tasks, one attempt,
# same agent/environment contract as baseline_job.yaml. Used by scripts/phase.sh smoke after the oracle run and the vLLM
# context probe.
job_name: smoke-qwen
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 8
retry:
  max_retries: 2
  include_exceptions: ["EnvironmentStartError", "AddTestsDirError", "DownloadVerifierDirError", "TimeoutError"]
environment:
  type: modal
  override_cpus: 1
  override_memory_mb: 1024
  override_storage_mb: 1024
  suppress_override_warnings: true
verifier:
  override_timeout_sec: 300
agents:
  - name: terminus-2
    model_name: hosted_vllm/Qwen3-8B
    override_timeout_sec: 1200
    kwargs:
      api_base: http://127.0.0.1:8000/v1
      max_turns: 32
      suppress_max_turns_warning: true
      enable_summarize: false
      store_all_messages: true
      collect_rollout_details: true
      temperature: 1.0
      model_info: {max_input_tokens: 32768, max_output_tokens: 8192, input_cost_per_token: 0.0, output_cost_per_token: 0.0}
      llm_kwargs: {timeout: 900, max_retries: 0, top_p: 1.0, top_k: -1, min_p: 0.0}   # no max_tokens: server cap 8192, clipped
datasets:
  - path: tasks/train
    n_tasks: 4
  - path: tasks/dev
    n_tasks: 4
artifacts:
  - /app/findings.json
